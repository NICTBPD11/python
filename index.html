<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICT Python Academy - Learn Python Programming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.8/index.min.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        code, pre, .code-block { font-family: 'JetBrains Mono', monospace; }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .code-block {
            background: #1a1a2e;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }

        .code-header {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
            padding: 8px 16px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* Syntax highlighting colors */
        .py-keyword { color: #c084fc; font-weight: 500; }
        .py-string { color: #34d399; }
        .py-comment { color: #6b7280; font-style: italic; }
        .py-number { color: #fbbf24; }
        .py-builtin { color: #f472b6; }
        .py-decorator { color: #fb923c; }
        .py-operator { color: #fb923c; }
        .py-plain { color: #e5e7eb; }

        .nav-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.3), transparent);
            border-left: 3px solid #6366f1;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-dot {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 3px; }

        .quiz-option {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .quiz-option:hover:not(.answered) {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }

        .quiz-option.correct {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
        }

        .quiz-option.wrong {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                z-index: 50;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
        }

        .quiz-nav-dot {
            transition: all 0.2s ease;
        }
        .quiz-nav-dot.active {
            background: #6366f1;
            transform: scale(1.3);
        }
    </style>
</head>
<body class="text-white overflow-x-hidden" x-data="app()" x-init="init()">
    <div class="blob w-96 h-96 bg-indigo-600 top-0 left-0"></div>
    <div class="blob w-96 h-96 bg-purple-600 bottom-0 right-0"></div>
    <div class="blob w-64 h-64 bg-cyan-600 top-1/2 left-1/2"></div>

    <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden fixed top-4 left-4 z-50 glass p-2 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>

    <div class="flex min-h-screen relative z-10">
        <aside :class="mobileMenuOpen ? 'mobile-open' : ''" class="sidebar fixed md:relative h-screen overflow-y-auto scrollbar-thin glass-strong w-[280px] flex-shrink-0">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                        <span class="text-xl font-bold">🐍</span>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg gradient-text">NICT Python</h1>
                        <p class="text-xs text-gray-400">Academy</p>
                    </div>
                </div>

                <div class="glass rounded-xl p-4 mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-300">Your Progress</span>
                        <span class="text-sm font-bold text-indigo-400" x-text="progress + '%'"></span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-2">
                        <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-2 rounded-full transition-all duration-500" :style="`width: ${progress}%`"></div>
                    </div>
                    <p class="text-xs text-gray-400 mt-2" x-text="completedTopics + '/' + totalTopics + ' topics completed'"></p>
                </div>

                <nav class="space-y-1">
                    <template x-for="(topic, index) in topics" :key="index">
                        <button @click="currentTopic = index; mobileMenuOpen = false; markVisited(index)"
                                :class="currentTopic === index ? 'active' : ''"
                                class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 text-sm">
                            <span class="text-lg" x-text="topic.icon"></span>
                            <span class="flex-1 truncate" x-text="topic.title"></span>
                            <span x-show="topic.visited" class="w-2 h-2 rounded-full bg-green-400 pulse-dot"></span>
                        </button>
                    </template>
                </nav>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-5xl mx-auto">
                <header class="mb-8 fade-in">
                    <div class="flex items-center justify-between flex-wrap gap-4">
                        <div>
                            <h2 class="text-3xl md:text-4xl font-bold gradient-text mb-2" x-text="topics[currentTopic].title"></h2>
                            <p class="text-gray-400" x-text="topics[currentTopic].subtitle"></p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button @click="toggleBookmark()" class="glass px-4 py-2 rounded-lg hover:bg-white/10 transition flex items-center gap-2">
                                <span x-text="isBookmarked ? '⭐' : '☆'"></span>
                                <span class="text-sm" x-text="isBookmarked ? 'Bookmarked' : 'Bookmark'"></span>
                            </button>
                            <button @click="completeTopic()" x-show="!topics[currentTopic].completed" class="bg-gradient-to-r from-indigo-500 to-purple-600 px-4 py-2 rounded-lg hover:opacity-90 transition text-sm font-medium">
                                ✓ Mark Complete
                            </button>
                            <span x-show="topics[currentTopic].completed" class="bg-green-500/20 text-green-400 px-4 py-2 rounded-lg text-sm font-medium">
                                ✓ Completed
                            </span>
                        </div>
                    </div>
                </header>

                <div class="space-y-6 fade-in" :key="currentTopic">
                    <template x-for="(section, sIndex) in topics[currentTopic].sections" :key="sIndex">
                        <div class="glass rounded-2xl p-6 md:p-8">
                            <h3 class="text-xl md:text-2xl font-bold mb-4 flex items-center gap-3">
                                <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500/30 to-purple-500/30 flex items-center justify-center text-sm" x-text="sIndex + 1"></span>
                                <span x-text="section.title"></span>
                            </h3>

                            <div class="text-gray-300 leading-relaxed space-y-4" x-html="section.content"></div>

                            <template x-for="(code, cIndex) in (section.codes || [])" :key="'code-' + sIndex + '-' + cIndex">
                                <div class="code-block mt-4">
                                    <div class="code-header flex items-center justify-between">
                                        <div class="flex items-center gap-2">
                                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                                            <span class="text-xs text-gray-400 ml-2" x-text="code.title || 'python'"></span>
                                        </div>
                                        <button @click="copyCode(code.code)" class="text-xs text-gray-400 hover:text-white transition px-2 py-1 rounded hover:bg-white/10">
                                            📋 Copy
                                        </button>
                                    </div>
                                    <pre class="p-4 overflow-x-auto text-sm leading-relaxed"><code x-html="highlightPython(code.code)"></code></pre>
                                    <div x-show="code.output" class="border-t border-gray-700/50 p-4 bg-black/30">
                                        <p class="text-xs text-gray-500 mb-1">▶ Output:</p>
                                        <pre class="text-sm text-green-400 whitespace-pre-wrap" x-text="code.output"></pre>
                                    </div>
                                </div>
                            </template>

                            <div x-show="section.keyPoints" class="mt-6 glass rounded-xl p-5">
                                <h4 class="font-bold text-indigo-400 mb-3 flex items-center gap-2">💡 Key Points</h4>
                                <ul class="space-y-2">
                                    <template x-for="(point, pIndex) in (section.keyPoints || [])" :key="pIndex">
                                        <li class="flex items-start gap-2 text-sm text-gray-300">
                                            <span class="text-indigo-400 mt-1">▸</span>
                                            <span x-text="point"></span>
                                        </li>
                                    </template>
                                </ul>
                            </div>

                            <div x-show="section.table" class="mt-6 overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead>
                                        <tr class="border-b border-gray-700">
                                            <template x-for="(header, hIndex) in (section.table?.headers || [])" :key="hIndex">
                                                <th class="text-left py-3 px-4 text-indigo-400 font-semibold" x-text="header"></th>
                                            </template>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="(row, rIndex) in (section.table?.rows || [])" :key="rIndex">
                                            <tr class="border-b border-gray-700/50 hover:bg-white/5 transition">
                                                <template x-for="(cell, cIndex) in row" :key="cIndex">
                                                    <td class="py-3 px-4 text-gray-300" x-text="cell"></td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>

                    <!-- Interactive Quiz Section with Multiple Questions -->
                    <div x-show="topics[currentTopic].quizzes && topics[currentTopic].quizzes.length > 0" class="glass rounded-2xl p-6 md:p-8">
                        <h3 class="text-xl font-bold mb-4 flex items-center gap-3">
                            <span class="text-2xl">🧠</span>
                            Practice Quiz
                            <span class="text-sm font-normal text-gray-400" x-text="`(${currentQuizIndex + 1}/${topics[currentTopic].quizzes.length})`"></span>
                        </h3>
                        
                        <template x-if="topics[currentTopic].quizzes && topics[currentTopic].quizzes.length > 0">
                            <div>
                                <!-- Quiz navigation dots -->
                                <div class="flex gap-2 mb-5 flex-wrap">
                                    <template x-for="(q, qIdx) in topics[currentTopic].quizzes" :key="qIdx">
                                        <button @click="switchQuiz(qIdx)" 
                                                :class="currentQuizIndex === qIdx ? 'active' : ''"
                                                class="quiz-nav-dot w-8 h-8 rounded-full bg-gray-700 text-xs font-bold flex items-center justify-center hover:bg-indigo-500/50"
                                                x-text="qIdx + 1"></button>
                                    </template>
                                </div>

                                <p class="text-gray-300 mb-4 font-medium" x-text="topics[currentTopic].quizzes[currentQuizIndex].question"></p>
                                <div class="space-y-3">
                                    <template x-for="(option, oIndex) in topics[currentTopic].quizzes[currentQuizIndex].options" :key="oIndex">
                                        <button @click="checkAnswer(oIndex)"
                                                :class="getQuizClass(oIndex)"
                                                class="quiz-option w-full text-left px-5 py-3 rounded-xl border border-gray-700 text-sm">
                                            <span class="font-medium mr-2" x-text="String.fromCharCode(65 + oIndex) + '.'"></span>
                                            <span x-text="option"></span>
                                        </button>
                                    </template>
                                </div>
                                <p x-show="quizAnswered" class="mt-4 text-sm p-3 rounded-lg" :class="quizCorrect ? 'text-green-400 bg-green-500/10' : 'text-red-400 bg-red-500/10'" x-text="quizCorrect ? '✅ Correct! Great job!' : '❌ Not quite. The correct answer is highlighted in green.'"></p>
                                
                                <div x-show="topics[currentTopic].quizzes[currentQuizIndex].explanation" class="mt-4 p-4 glass rounded-lg">
                                    <p class="text-xs text-indigo-400 font-bold mb-1">💡 Explanation:</p>
                                    <p class="text-sm text-gray-300" x-text="topics[currentTopic].quizzes[currentQuizIndex].explanation"></p>
                                </div>

                                <div class="flex justify-between mt-5">
                                    <button @click="prevQuiz()" :disabled="currentQuizIndex === 0" class="glass px-4 py-2 rounded-lg text-sm hover:bg-white/10 transition disabled:opacity-30">← Previous</button>
                                    <button @click="nextQuiz()" :disabled="currentQuizIndex === topics[currentTopic].quizzes.length - 1" class="bg-gradient-to-r from-indigo-500 to-purple-600 px-4 py-2 rounded-lg text-sm hover:opacity-90 transition disabled:opacity-30">Next →</button>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="flex justify-between items-center pt-4">
                        <button @click="prevTopic()" :disabled="currentTopic === 0" class="glass px-5 py-3 rounded-xl hover:bg-white/10 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                            Previous
                        </button>
                        <span class="text-sm text-gray-400" x-text="(currentTopic + 1) + ' / ' + totalTopics"></span>
                        <button @click="nextTopic()" :disabled="currentTopic === totalTopics - 1" class="bg-gradient-to-r from-indigo-500 to-purple-600 px-5 py-3 rounded-xl hover:opacity-90 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
                            Next
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        </button>
                    </div>
                </div>

                <footer class="mt-12 text-center text-gray-500 text-sm pb-8">
                    <p>NICT Python Academy © 2026 | Prepared by Faculty</p>
                    <p class="mt-1">Learn Python the Right Way 🐍</p>
                </footer>
            </div>
        </main>
    </div>

    <div x-show="showToast" x-transition class="fixed bottom-6 right-6 glass-strong rounded-xl px-5 py-3 flex items-center gap-3 z-50">
        <span x-text="toastIcon"></span>
        <span class="text-sm" x-text="toastMessage"></span>
    </div>

    <script>
        function app() {
            return {
                currentTopic: 0,
                currentQuizIndex: 0,
                mobileMenuOpen: false,
                progress: 0,
                completedTopics: 0,
                totalTopics: 12,
                isBookmarked: false,
                quizAnswered: false,
                quizCorrect: false,
                selectedAnswer: -1,
                showToast: false,
                toastMessage: '',
                toastIcon: '',

                topics: [
                    {
                        title: "Introduction to Python",
                        subtitle: "Get started with the world's most beginner-friendly programming language",
                        icon: "🚀",
                        visited: false,
                        completed: false,
                        sections: [
                            {
                                title: "What is Python?",
                                content: `<p>Python is a <strong class="text-indigo-400">popular, interpreted, object-oriented, high-level programming language</strong> with dynamic semantics. It was created by <strong class="text-purple-400">Guido van Rossum</strong> and first released in <strong class="text-cyan-400">1991</strong>.</p>
                                <p class="mt-3">The name "Python" is a nod to the British comedy group <em>Monty Python</em>. Python has a reputation as a beginner-friendly language because it handles much of the complexity for the user.</p>`,
                                keyPoints: [
                                    "Created by Guido van Rossum in 1991 at CWI, Netherlands",
                                    "Interpreted language - code executes line by line",
                                    "Dynamically typed - no need to declare variable types",
                                    "Cross-platform - runs on Windows, Mac, Linux, Raspberry Pi",
                                    "Simple syntax similar to English language"
                                ]
                            },
                            {
                                title: "Why Learn Python?",
                                content: `<p>Python is used in many domains and is one of the most versatile programming languages available today:</p>`,
                                keyPoints: [
                                    "Web Development (server-side) - Django, Flask",
                                    "Data Science & Machine Learning - NumPy, Pandas, TensorFlow",
                                    "Software Development & System Scripting",
                                    "Processing Big Data & Mathematical Computations",
                                    "Fast Prototyping & Production-ready Software",
                                    "Desktop GUI Applications - Tkinter, PyQt",
                                    "Game Development, Automation, and much more!"
                                ]
                            },
                            {
                                title: "Python Features",
                                content: `<p>Python comes packed with powerful features that make it stand out:</p>`,
                                table: {
                                    headers: ["Feature", "Description"],
                                    rows: [
                                        ["Easy to Learn", "Simple syntax, no semicolons or curly brackets needed"],
                                        ["Expressive", "Complex tasks in fewer lines of code"],
                                        ["Interpreted", "Executed line by line, easy debugging"],
                                        ["Cross-platform", "Runs on Windows, Linux, Mac, etc."],
                                        ["Open Source", "Free to use and contribute"],
                                        ["Object-Oriented", "Supports classes, inheritance, polymorphism"],
                                        ["Dynamic Typing", "No need to declare variable types"],
                                        ["GUI Support", "Tkinter, PyQt, Kivy libraries"],
                                        ["Integrated", "Works with C, C++, Java"]
                                    ]
                                }
                            },
                            {
                                title: "Your First Python Program",
                                content: `<p>Let's write the classic "Hello, World!" program - the first step in any programming journey!</p>`,
                                codes: [
                                    {
                                        title: "hello.py",
                                        code: `# My First Python Program
print("Hello, World!")
print("Welcome to NICT Python Academy!")

# Python is case-sensitive
Print("Hello")  # This will cause an error!`,
                                        output: `Hello, World!
Welcome to NICT Python Academy!`
                                    },
                                    {
                                        title: "simple_calculator.py",
                                        code: `# Simple arithmetic operations
a = 15
b = 4
print("Addition:", a + b)
print("Subtraction:", a - b)
print("Multiplication:", a * b)
print("Division:", a / b)
print("Floor Division:", a // b)
print("Modulus:", a % b)
print("Power:", a ** b)`,
                                        output: `Addition: 19
Subtraction: 11
Multiplication: 60
Division: 3.75
Floor Division: 3
Modulus: 3
Power: 50625`
                                    }
                                ],
                                keyPoints: [
                                    "Python files have .py extension",
                                    "print() function displays output on screen",
                                    "No semicolons needed at end of statements",
                                    "Comments start with # symbol",
                                    "Python is case-sensitive (Print ≠ print)"
                                ]
                            },
                            {
                                title: "Python Command Line & IDLE",
                                content: `<p>Python can be run in two modes: <strong class="text-indigo-400">Interactive Mode</strong> (command line) and <strong class="text-purple-400">Script Mode</strong> (using .py files).</p>`,
                                codes: [
                                    {
                                        title: "command_line.txt",
                                        code: `# Check Python version
C:\\Users\\YourName> python --version
Python 3.11.4

# Start Python interactive mode
C:\\Users\\YourName> python
>>> print("Hello, World!")
Hello, World!
>>> 5 + 3
8
>>> exit()`,
                                        output: `Python 3.11.4
Hello, World!
8`
                                    }
                                ],
                                keyPoints: [
                                    "Use 'python --version' to check installation",
                                    "Interactive mode (>>>) for quick testing",
                                    "Script mode for writing full programs",
                                    "Use exit() or Ctrl+D to quit interactive mode",
                                    "IDLE is Python's built-in IDE"
                                ]
                            },
                            {
                                title: "Python History & Versions",
                                content: `<p>Understanding Python's evolution helps appreciate its design:</p>`,
                                table: {
                                    headers: ["Year", "Version", "Key Changes"],
                                    rows: [
                                        ["1989", "Development Started", "Guido van Rossum at CWI, Netherlands"],
                                        ["1991", "v0.9.0", "First public release"],
                                        ["1994", "v1.0", "Added lambda, map, filter, reduce"],
                                        ["2000", "v2.0", "List comprehensions, garbage collection"],
                                        ["2008", "v3.0 (Py3K)", "Designed to fix fundamental flaws"],
                                        ["2026", "v3.12+", "Current major version (what we use!)"]
                                    ]
                                }
                            }
                        ],
                        quizzes: [
                            {
                                question: "Who created Python programming language?",
                                options: ["James Gosling", "Guido van Rossum", "Dennis Ritchie", "Bjarne Stroustrup"],
                                correct: 1,
                                explanation: "Guido van Rossum created Python at CWI in Netherlands. He started development in December 1989 and released it in 1991."
                            },
                            {
                                question: "In which year was Python first released?",
                                options: ["1989", "1991", "1995", "2000"],
                                correct: 1,
                                explanation: "Python was first released in February 1991, labeled as version 0.9.0."
                            },
                            {
                                question: "Which of the following is NOT a feature of Python?",
                                options: ["Interpreted language", "Compiled language", "Object-oriented", "Dynamically typed"],
                                correct: 1,
                                explanation: "Python is an interpreted language, not compiled. Code is executed line by line by the Python interpreter."
                            },
                            {
                                question: "The name 'Python' is derived from:",
                                options: ["A snake species", "Monty Python comedy group", "A Greek philosopher", "A mathematical term"],
                                correct: 1,
                                explanation: "The name 'Python' is a nod to the British comedy group 'Monty Python's Flying Circus'."
                            }
                        ]
                    },
                    {
                        title: "Python Basics",
                        subtitle: "Learn the fundamental building blocks of Python programming",
                        icon: "📦",
                        visited: false,
                        completed: false,
                        sections: [
                            {
                                title: "Identifiers & Keywords",
                                content: `<p><strong class="text-indigo-400">Identifiers</strong> are names given to variables, classes, methods, functions, etc. <strong class="text-purple-400">Keywords</strong> are reserved words that cannot be used as identifiers.</p>`,
                                codes: [
                                    {
                                        title: "identifiers.py",
                                        code: `# Valid Identifiers
language = 'Python'
_score = 100

                    this.updateProgress();

                    this.completedTopics = this.topics.filter(t => t.completed).length;
                    this.progress = Math.round((this.completedTopics / this.totalTopics) * 100);
                },

                    this.topics[index].visited = true;
                    this.quizAnswered = false;

                    this.currentQuizIndex = 0;
                    this.isBookmarked = false;
                    this.saveProgress();

                },

                // FIXED: Token-based syntax highlighter that doesn't produce nested/broken HTML
                highlightPython(code) {
                    // Step 1: Escape HTML entities first
                    let text = code
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    
                    // Step 2: Tokenize - find all tokens and replace with placeholders
                    const tokens = [];
                    let tokenIndex = 0;
                    
                    // Replace triple-quoted strings first
                    text = text.replace(/("""[\s\S]*?"""|'''[\s\S]*?''')/g, (match) => {
                        const placeholder = `__TOKEN_${tokenIndex}__`;
                        tokens.push({ placeholder, html: `<span class="py-string">${match}</span>`, index: tokenIndex });
                        tokenIndex++;
                        return placeholder;
                    });
                    
                    // Replace single/double quoted strings
                    text = text.replace(/('[^']*'|"[^"]*")/g, (match) => {
                        const placeholder = `__TOKEN_${tokenIndex}__`;
                        tokens.push({ placeholder, html: `<span class="py-string">${match}</span>`, index: tokenIndex });
                        tokenIndex++;
                        return placeholder;
                    });
                    
                    // Replace comments (must be after strings)
                    text = text.replace(/(#.*$)/gm, (match) => {
                        const placeholder = `__TOKEN_${tokenIndex}__`;
                        tokens.push({ placeholder, html: `<span class="py-comment">${match}</span>`, index: tokenIndex });
                        tokenIndex++;
                        return placeholder;
                    });
                    
                    // Replace decorators
                    text = text.replace(/(@\w+)/g, (match) => {
                        const placeholder = `__TOKEN_${tokenIndex}__`;
                        tokens.push({ placeholder, html: `<span class="py-decorator">${match}</span>`, index: tokenIndex });
                        tokenIndex++;
                        return placeholder;
                    });
                    
                    // Step 3: Highlight keywords (now safe - no HTML in text to match)
                    const keywords = ['def', 'class', 'if', 'elif', 'else', 'for', 'while', 'break', 'continue', 'return', 'import', 'from', 'as', 'try', 'except', 'finally', 'with', 'raise', 'pass', 'lambda', 'in', 'not', 'and', 'or', 'is', 'True', 'False', 'None', 'global', 'nonlocal', 'yield', 'assert', 'del'];
                    keywords.forEach(kw => {
                        const regex = new RegExp(`\\b(${kw})\\b`, 'g');
                        text = text.replace(regex, `<span class="py-keyword">$1</span>`);
                    });
                    
                    // Highlight built-in functions
                    const builtins = ['print', 'input', 'len', 'type', 'range', 'int', 'float', 'str', 'list', 'dict', 'set', 'tuple', 'bool', 'abs', 'max', 'min', 'sum', 'sorted', 'reversed', 'enumerate', 'zip', 'map', 'filter', 'open', 'isinstance', 'super', 'exit', 'quit', 'round', 'pow', 'help', 'dir', 'id', 'hash', 'repr'];
                    builtins.forEach(fn => {
                        const regex = new RegExp(`\\b(${fn})\\s*(?=\\()`, 'g');
                        text = text.replace(regex, `<span class="py-builtin">$1</span>`);
                    });
                    
                    // Highlight numbers
                    text = text.replace(/\b(\d+\.?\d*)\b/g, '<span class="py-number">$1</span>');
                    
                    // Step 4: Restore all tokens
                    tokens.forEach(token => {
                        text = text.replace(token.placeholder, token.html);
                    });
                    
                    return text;
                },

                copyCode(code) {
                    navigator.clipboard.writeText(code).then(() => {
                        this.showToastMsg('📋', 'Code copied to clipboard!');
                    });
                },

                showToastMsg(icon, message) {
                    this.toastIcon = icon;
                    this.toastMessage = message;
                    this.showToast = true;
                    setTimeout(() => { this.showToast = false; }, 2500);
                }
            }
        }
    </script>
